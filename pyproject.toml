[project]
name = "design-ontology-harness"
version = "0.1.0"
description = "GitHub-distributed harness for building reusable design-system knowledge bases and brand-specific system outputs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "httpx>=0.27.2",
  "pillow>=10.4.0",
]

[project.scripts]
design-ontology = "design_ontology_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
