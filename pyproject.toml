[project]
name = "design-ontology-harness"
version = "0.1.0"
description = "GitHub-distributed harness for building reusable design-system knowledge bases and brand-specific system outputs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "httpx>=0.27.2",
  "pillow>=10.4.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
]

[project.scripts]
design-ontology = "design_ontology_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["design_ontology_harness"]

[tool.hatch.build.targets.sdist]
include = [
  "design_ontology_harness",
  "schemas",
  "presets",
  "adapters",
  "scripts",
  "docs",
  "README.md",
  "LICENSE",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
