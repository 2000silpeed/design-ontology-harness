name: catalog-health

# Phase 13-11-C-3-c — 분기별 catalog-health 리포트 자동화.
# 주 1회 (월 09:00 UTC) catalog-health 를 재계산해서
# presets/CATALOG_HEALTH.md 가 drift 된 경우 PR 을 자동 생성한다.
#
# 실행 전제: GITHUB_TOKEN 은 contents:write + pull-requests:write 권한.
# 기본 GITHUB_TOKEN 으로 충분하며 PR 은 본 레포에서 본 레포로 생성된다.

on:
  schedule:
    # 월요일 09:00 UTC = 월요일 18:00 KST (한국 기준 오전 주간 리뷰 전에 반영)
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-catalog-health:
    name: Refresh CATALOG_HEALTH.md and open PR on drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Sync dependencies
        run: uv sync

      - name: Regenerate catalog-health
        run: uv run design-ontology catalog-health --output presets/CATALOG_HEALTH.md

      - name: Detect drift
        id: diff
        run: |
          if git diff --quiet -- presets/CATALOG_HEALTH.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no drift — exiting no-op"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- presets/CATALOG_HEALTH.md
          fi

      - name: Create pull request on drift
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore(catalog-health): weekly refresh
          title: "chore(catalog-health): weekly refresh"
          body: |
            Automated weekly refresh of `presets/CATALOG_HEALTH.md`
            generated by `.github/workflows/catalog-health.yml`.

            See diff for coverage / deprecation candidate / priority empty cell changes.

            Generated at the scheduled Monday 09:00 UTC run.
          branch: chore/catalog-health-weekly
          delete-branch: true
          labels: |
            chore
            catalog-health
          draft: false

      - name: Summary
        run: |
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            echo "Catalog health drift detected — PR opened."
          else
            echo "Catalog health unchanged — skipping PR."
          fi
