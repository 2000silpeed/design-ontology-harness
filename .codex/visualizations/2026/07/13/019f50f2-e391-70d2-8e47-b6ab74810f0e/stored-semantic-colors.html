<script>
  (() => {
    const root = document.getElementById('stored-semantic-colors');
    const data = JSON.parse(document.getElementById('stored-color-data').textContent);
    const sections = document.getElementById('stored-color-sections');
    const groupLabels = {
      red: '빨강',
      orange: '주황',
      yellow: '노랑',
      green: '초록',
      blue: '파랑',
      violet: '보라',
      neutral: '중립색'
    };
    const groupOrder = ['red', 'orange', 'yellow', 'green', 'blue', 'violet', 'neutral'];

    function displayName(item) {
      return item.name.replace(/ \(Pantone COY \d{4}\)$/, '');
    }

    function displayCategory(item) {
      const year = item.name.match(/Pantone COY (\d{4})/);
      return year ? `Pantone Color of the Year ${year[1]}` : item.category;
    }

    function sourceLabel(item) {
      return item.source === 'Visible card' ? '표시 카드' : '내장 온톨로지';
    }

    function selectColor(item, button) {
      root.querySelectorAll('button[aria-pressed="true"]').forEach((current) => {
        current.setAttribute('aria-pressed', 'false');
      });
      button.setAttribute('aria-pressed', 'true');
      document.getElementById('stored-color-name').textContent = displayName(item);
      document.getElementById('stored-color-hex').textContent = item.hex;
      document.getElementById('stored-color-meta').textContent = `${displayCategory(item)} · ${sourceLabel(item)}`;
      document.getElementById('stored-color-mark').style.setProperty('--selected-color', item.hex);
    }

    groupOrder.forEach((group) => {
      const groupItems = data.filter((item) => item.group === group);
      if (!groupItems.length) return;

      const section = document.createElement('section');
      section.className = 'palette-section';
      const heading = document.createElement('h3');
      heading.textContent = `${groupLabels[group]} · ${groupItems.length}`;
      section.appendChild(heading);

      const grid = document.createElement('div');
      grid.className = 'viz-grid';
      groupItems.forEach((item, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'btn viz-tile';
        button.setAttribute('aria-pressed', group === 'red' && index === 0 ? 'true' : 'false');
        button.setAttribute('aria-label', `${displayName(item)}, ${item.hex}, ${displayCategory(item)}, ${sourceLabel(item)}`);

        const mark = document.createElement('span');
        mark.className = 'palette-color-mark';
        mark.style.setProperty('--swatch', item.hex);
        mark.setAttribute('aria-hidden', 'true');

        const name = document.createElement('span');
        name.className = 'palette-name';
        name.textContent = displayName(item);

        button.append(mark, name);
        button.addEventListener('click', () => selectColor(item, button));
        grid.appendChild(button);
      });
      section.appendChild(grid);
      sections.appendChild(section);
    });

    document.getElementById('stored-color-mark').style.setProperty('--selected-color', data[0].hex);
  })();
</script>
