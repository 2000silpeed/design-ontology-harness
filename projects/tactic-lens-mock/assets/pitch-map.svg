<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">TacticLens pitch map</title>
  <desc id="desc">A tactical football pitch map with team shape, pressure lanes, and tracked player positions.</desc>
  <defs>
    <linearGradient id="field" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f4f3b"/>
      <stop offset="0.48" stop-color="#123f35"/>
      <stop offset="1" stop-color="#0a2f35"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" x2="1">
      <stop offset="0" stop-color="#00b1d2" stop-opacity=".05"/>
      <stop offset=".6" stop-color="#00b1d2" stop-opacity=".3"/>
      <stop offset="1" stop-color="#50c878" stop-opacity=".08"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="960" height="540" rx="26" fill="#071a20"/>
  <rect x="32" y="28" width="896" height="484" rx="22" fill="url(#field)" stroke="#d9f7ea" stroke-opacity=".74" stroke-width="3"/>
  <path d="M480 28v484M32 270h896" stroke="#e7fff4" stroke-opacity=".32" stroke-width="2"/>
  <circle cx="480" cy="270" r="74" fill="none" stroke="#e7fff4" stroke-opacity=".52" stroke-width="2"/>
  <circle cx="480" cy="270" r="5" fill="#e7fff4" fill-opacity=".8"/>
  <rect x="32" y="156" width="118" height="228" fill="none" stroke="#e7fff4" stroke-opacity=".52" stroke-width="2"/>
  <rect x="810" y="156" width="118" height="228" fill="none" stroke="#e7fff4" stroke-opacity=".52" stroke-width="2"/>
  <rect x="32" y="214" width="44" height="112" fill="none" stroke="#e7fff4" stroke-opacity=".45" stroke-width="2"/>
  <rect x="884" y="214" width="44" height="112" fill="none" stroke="#e7fff4" stroke-opacity=".45" stroke-width="2"/>
  <path d="M106 270c34-48 91-76 171-83 84-7 160 9 229 50 91 53 170 53 270 1" fill="none" stroke="#ffbf00" stroke-opacity=".64" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 18"/>
  <path d="M126 354c96-84 196-119 300-104 96 13 175 71 283 79" fill="none" stroke="url(#lane)" stroke-width="54" stroke-linecap="round"/>
  <path d="M224 160l122 70 134-18 130 84 138-28" fill="none" stroke="#00b1d2" stroke-opacity=".78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M205 338l137-48 133 50 142-38 126 76" fill="none" stroke="#50c878" stroke-opacity=".75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#f8f8f4" stroke="#00b1d2" stroke-width="5">
    <circle cx="224" cy="160" r="16"/>
    <circle cx="346" cy="230" r="16"/>
    <circle cx="480" cy="212" r="16"/>
    <circle cx="610" cy="296" r="16"/>
    <circle cx="748" cy="268" r="16"/>
  </g>
  <g fill="#50c878" stroke="#f8f8f4" stroke-width="4">
    <circle cx="205" cy="338" r="14"/>
    <circle cx="342" cy="290" r="14"/>
    <circle cx="475" cy="340" r="14"/>
    <circle cx="617" cy="302" r="14"/>
    <circle cx="743" cy="378" r="14"/>
  </g>
  <g fill="#bd2e4a" stroke="#fff" stroke-width="3">
    <circle cx="684" cy="220" r="12"/>
    <circle cx="706" cy="246" r="12"/>
    <circle cx="728" cy="304" r="12"/>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">
