<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>모아챗</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="./colors.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app" data-theme="light">
    <aside class="workspace-rail" aria-label="워크스페이스">
      <a class="brand" href="../research/geist/README.md" aria-label="모아챗">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>
          <strong>모아챗</strong>
          <small>팀 대화함</small>
        </span>
      </a>

      <nav class="rail-nav" aria-label="주요 메뉴">
        <button class="rail-item active" type="button">
          <i data-lucide="message-square-text" aria-hidden="true"></i>
          <span>대화</span>
          <strong>8</strong>
        </button>
        <button class="rail-item" type="button">
          <i data-lucide="inbox" aria-hidden="true"></i>
          <span>받은 요청</span>
          <strong>14</strong>
        </button>
        <button class="rail-item" type="button">
          <i data-lucide="users" aria-hidden="true"></i>
          <span>팀</span>
          <strong>6</strong>
        </button>
        <button class="rail-item" type="button">
          <i data-lucide="archive" aria-hidden="true"></i>
          <span>보관함</span>
          <strong>32</strong>
        </button>
      </nav>

      <div class="rail-section">
        <label for="workspaceSelect">워크스페이스</label>
        <select id="workspaceSelect">
          <option>제품 운영팀</option>
          <option>고객지원팀</option>
          <option>런칭 준비방</option>
        </select>
      </div>

      <div class="account-card">
        <span class="avatar compact">수</span>
        <span>
          <strong>수진</strong>
          <small>지금 응답 가능</small>
        </span>
      </div>
    </aside>

    <aside class="room-list" aria-label="대화방 목록">
      <div class="room-toolbar">
        <label class="search-field" for="roomSearch">
          <i data-lucide="search" aria-hidden="true"></i>
          <input id="roomSearch" type="search" placeholder="대화방 검색">
        </label>
        <button class="icon-button" type="button" id="openCommand" aria-label="명령 메뉴 열기">
          <i data-lucide="command" aria-hidden="true"></i>
        </button>
      </div>

      <div class="room-group">
        <div class="group-title">고정됨</div>
        <button class="room-item active" type="button" data-room="launch">
          <span class="avatar blue">런</span>
          <span class="room-copy">
            <strong>런칭 준비방</strong>
            <small>하루 전 보낸 메시지까지 정리했어요.</small>
          </span>
          <time>09:42</time>
        </button>
        <button class="room-item" type="button" data-room="support">
          <span class="avatar green">지</span>
          <span class="room-copy">
            <strong>고객지원 분류</strong>
            <small>환불 문의 3건은 민재에게 넘겼어요.</small>
          </span>
          <time>09:18</time>
        </button>
      </div>

      <div class="room-group">
        <div class="group-title">오늘</div>
        <button class="room-item" type="button" data-room="design">
          <span class="avatar">디</span>
          <span class="room-copy">
            <strong>디자인 리뷰</strong>
            <small>모바일 입력창 높이만 다시 보면 됩니다.</small>
          </span>
          <time>08:56</time>
        </button>
        <button class="room-item" type="button" data-room="infra">
          <span class="avatar amber">인</span>
          <span class="room-copy">
            <strong>인프라 알림</strong>
            <small>서울 리전 지연이 정상 범위로 돌아왔어요.</small>
          </span>
          <time>08:30</time>
        </button>
        <button class="room-item unread" type="button" data-room="sales">
          <span class="avatar red">세</span>
          <span class="room-copy">
            <strong>세일즈 문의</strong>
            <small>가격표 링크를 새 버전으로 바꿔야 해요.</small>
          </span>
          <time>7</time>
        </button>
      </div>
    </aside>

    <main class="chat-shell">
      <header class="chat-header">
        <div class="chat-title">
          <div class="avatar blue">런</div>
          <div>
            <div class="breadcrumb">제품 운영팀 / 고정 대화</div>
            <h1 id="roomTitle">런칭 준비방</h1>
          </div>
        </div>
        <div class="chat-actions">
          <button class="button secondary" type="button" id="themeToggle">
            <i data-lucide="moon" aria-hidden="true"></i>
            <span>다크 모드</span>
          </button>
          <button class="icon-button" type="button" aria-label="대화방 검색">
            <i data-lucide="search" aria-hidden="true"></i>
          </button>
          <button class="button primary" type="button" id="shareButton">
            <i data-lucide="send" aria-hidden="true"></i>
            <span>요약 공유</span>
          </button>
        </div>
      </header>

      <section class="status-strip" aria-label="대화 상태">
        <article class="status-card">
          <span class="metric-label">읽지 않은 메시지</span>
          <strong>8</strong>
          <span class="badge blue">곧 처리</span>
        </article>
        <article class="status-card">
          <span class="metric-label">열린 작업</span>
          <strong>14</strong>
          <span class="badge warning">확인 필요</span>
        </article>
        <article class="status-card">
          <span class="metric-label">응답 속도</span>
          <strong>4분</strong>
          <span class="badge success">목표 안</span>
        </article>
      </section>

      <section class="conversation-panel">
        <div class="message-list" id="messageList" aria-live="polite"></div>

        <form class="composer" id="composer">
          <div class="composer-tools" aria-label="작성 도구">
            <button class="tool-button" type="button" aria-label="파일 첨부">
              <i data-lucide="paperclip" aria-hidden="true"></i>
            </button>
            <button class="tool-button" type="button" aria-label="체크리스트 추가">
              <i data-lucide="list-checks" aria-hidden="true"></i>
            </button>
            <button class="tool-button" type="button" aria-label="멘션">
              <i data-lucide="at-sign" aria-hidden="true"></i>
            </button>
          </div>
          <label class="composer-input" for="messageInput">
            <span class="sr-only">메시지 입력</span>
            <textarea id="messageInput" rows="1" placeholder="메시지를 입력하세요. Shift+Enter로 줄바꿈"></textarea>
          </label>
          <button class="button primary send-button" type="submit">
            <i data-lucide="arrow-up" aria-hidden="true"></i>
            <span>보내기</span>
          </button>
        </form>
      </section>
    </main>

    <aside class="detail-panel" aria-label="대화 정보">
      <section class="panel-card">
        <div class="panel-heading">
          <h2>대화 요약</h2>
          <span class="badge neutral">자동 정리</span>
        </div>
        <p>런칭 전 점검은 결제 문구, 고객지원 매크로, 모바일 입력창 높이만 남았습니다.</p>
      </section>

      <section class="panel-card">
        <div class="panel-heading">
          <h2>열린 작업</h2>
          <button class="icon-button small" type="button" aria-label="작업 추가">
            <i data-lucide="plus" aria-hidden="true"></i>
          </button>
        </div>
        <ul class="task-list">
          <li>
            <label><input type="checkbox"> 가격표 링크 교체</label>
            <span class="badge warning">오늘</span>
          </li>
          <li>
            <label><input type="checkbox" checked> 출시 공지 초안 검토</label>
            <span class="badge success">완료</span>
          </li>
          <li>
            <label><input type="checkbox"> 모바일 QA 재확인</label>
            <span class="badge blue">담당 수진</span>
          </li>
        </ul>
      </section>

      <section class="panel-card">
        <div class="panel-heading">
          <h2>첨부 파일</h2>
          <span class="badge neutral">3개</span>
        </div>
        <div class="file-list">
          <a href="#" class="file-row">
            <i data-lucide="file-text" aria-hidden="true"></i>
            <span>출시공지_v4.md</span>
          </a>
          <a href="#" class="file-row">
            <i data-lucide="image" aria-hidden="true"></i>
            <span>mobile-chat-empty.png</span>
          </a>
          <a href="#" class="file-row">
            <i data-lucide="table" aria-hidden="true"></i>
            <span>가격표_검수.xlsx</span>
          </a>
        </div>
      </section>
    </aside>
  </div>

  <dialog class="command-dialog" id="commandDialog">
    <form method="dialog">
      <div class="command-header">
        <i data-lucide="command" aria-hidden="true"></i>
        <input id="commandInput" placeholder="대화방, 사람, 작업 검색">
        <button class="icon-button" value="cancel" aria-label="닫기">
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </div>
      <div class="command-list" id="commandList"></div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <i data-lucide="check-circle-2" aria-hidden="true"></i>
    <span>요약 링크를 복사했습니다.</span>
  </div>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
