<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" role="img" aria-labelledby="title desc">
  <title id="title">Lunar Cafe original comic magazine cover</title>
  <desc id="desc">A polished pastel manga magazine cover with an original cafe character, moonlit window, screentone shadows, speech bubbles, and editorial masthead.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#8E9AF1" />
      <stop offset=".48" stop-color="#B9B7F5" />
      <stop offset="1" stop-color="#F3E5AB" />
    </linearGradient>
    <linearGradient id="hair" x1="0" x2="1">
      <stop offset="0" stop-color="#191725" />
      <stop offset="1" stop-color="#453F73" />
    </linearGradient>
    <pattern id="tone" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.8" fill="#111111" opacity=".2" />
      <circle cx="12" cy="12" r="1.8" fill="#111111" opacity=".2" />
    </pattern>
    <pattern id="paper" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M0 10h22M10 0v22" stroke="#111111" stroke-width="1" opacity=".05" />
    </pattern>
    <filter id="ink" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="0" flood-color="#111111" flood-opacity=".85" />
    </filter>
  </defs>

  <rect width="720" height="960" rx="42" fill="url(#sky)" />
  <rect width="720" height="960" rx="42" fill="url(#paper)" opacity=".7" />
  <rect x="34" y="34" width="652" height="892" rx="32" fill="#FFFFFF" stroke="#111111" stroke-width="10" />

  <g aria-label="magazine masthead">
    <rect x="62" y="60" width="596" height="96" rx="18" fill="#111111" />
    <text x="82" y="124" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="58" font-weight="900" letter-spacing="-1">PANEL POP</text>
    <rect x="474" y="76" width="164" height="52" rx="26" fill="#F3E5AB" stroke="#FFFFFF" stroke-width="4" />
    <text x="498" y="111" fill="#111111" font-family="Arial, sans-serif" font-size="24" font-weight="900">ISSUE 18</text>
  </g>

  <g aria-label="moonlit cafe set">
    <rect x="72" y="184" width="576" height="378" rx="22" fill="#E6E6FA" stroke="#111111" stroke-width="9" />
    <rect x="102" y="222" width="516" height="244" rx="14" fill="#BFD7FF" stroke="#111111" stroke-width="7" />
    <circle cx="538" cy="280" r="62" fill="#F3E5AB" stroke="#111111" stroke-width="8" />
    <path d="M496 262c26 14 49 15 74 0-8 37-32 55-72 54 12-16 15-34-2-54Z" fill="#FFFFFF" opacity=".62" />
    <path d="M102 346h516M274 222v244M446 222v244" stroke="#111111" stroke-width="6" />
    <path d="M96 502h528" stroke="#111111" stroke-width="12" stroke-linecap="round" />
    <rect x="138" y="520" width="444" height="50" rx="18" fill="#FF6F61" stroke="#111111" stroke-width="8" />
  </g>

  <g aria-label="original manga character">
    <ellipse cx="365" cy="702" rx="178" ry="42" fill="#111111" opacity=".18" />
    <path d="M246 580c-38 46-60 116-64 212h355c-10-99-34-171-73-216-42 42-174 42-218 4Z" fill="#8E9AF1" stroke="#111111" stroke-width="10" stroke-linejoin="round" />
    <path d="M270 632c54 38 127 40 184 2" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity=".82" />
    <path d="M236 404c-18 54-18 112 0 172 36 64 208 64 248-2 20-58 18-119-6-174-44-64-194-62-242 4Z" fill="#FFDAB9" stroke="#111111" stroke-width="10" stroke-linejoin="round" />
    <path d="M216 424c16-96 80-148 176-148 76 0 128 32 158 96-56-20-106-15-152 15-49 32-104 44-182 37Z" fill="url(#hair)" stroke="#111111" stroke-width="10" stroke-linejoin="round" />
    <path d="M232 426c-10 48-16 93-8 136-28-40-40-83-36-128 3-36 16-68 38-94 12 28 14 56 6 86Z" fill="#2C284D" stroke="#111111" stroke-width="9" />
    <path d="M508 420c11 48 15 94 3 136 32-34 47-78 42-132-4-42-23-76-56-102-4 34 0 66 11 98Z" fill="#2C284D" stroke="#111111" stroke-width="9" />
    <ellipse cx="300" cy="506" rx="31" ry="38" fill="#FFFFFF" stroke="#111111" stroke-width="8" />
    <ellipse cx="427" cy="506" rx="31" ry="38" fill="#FFFFFF" stroke="#111111" stroke-width="8" />
    <circle cx="310" cy="516" r="13" fill="#111111" />
    <circle cx="437" cy="516" r="13" fill="#111111" />
    <circle cx="304" cy="506" r="5" fill="#FFFFFF" />
    <circle cx="431" cy="506" r="5" fill="#FFFFFF" />
    <path d="M343 558c18 15 42 15 62 0" fill="none" stroke="#111111" stroke-width="8" stroke-linecap="round" />
    <path d="M340 526h50" stroke="#111111" stroke-width="6" stroke-linecap="round" />
    <path d="M224 454c60-12 106-34 139-67M368 386c34 28 80 43 140 44" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity=".3" />
    <path d="M188 716c52-48 108-64 168-48M532 716c-49-45-103-62-164-48" fill="none" stroke="#111111" stroke-width="11" stroke-linecap="round" />
    <rect x="300" y="684" width="122" height="76" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="8" />
    <path d="M422 706h36c26 0 26 34 0 34h-36" fill="none" stroke="#111111" stroke-width="8" />
    <path d="M323 714h58M323 738h42" stroke="#FF6F61" stroke-width="7" stroke-linecap="round" />
  </g>

  <g aria-label="editorial callouts">
    <path d="M92 210c58-56 169-52 220 7 47 55 8 137-80 150-35 5-72 1-105-11l-58 54 14-78c-48-30-45-83 9-122Z" fill="#FFFFFF" stroke="#111111" stroke-width="8" stroke-linejoin="round" filter="url(#ink)" />
    <text x="116" y="266" fill="#111111" font-family="Arial, sans-serif" font-size="28" font-weight="900">NEW SHORT</text>
    <text x="116" y="304" fill="#111111" font-family="Arial, sans-serif" font-size="24" font-weight="700">MOON CAFE</text>
    <rect x="474" y="596" width="142" height="112" rx="18" fill="#FFFFFF" stroke="#111111" stroke-width="8" />
    <rect x="490" y="612" width="110" height="64" fill="url(#tone)" />
    <text x="496" y="694" fill="#111111" font-family="Arial, sans-serif" font-size="20" font-weight="900">3 PANELS</text>
  </g>

  <g aria-label="cover typography">
    <path d="M74 806h572v82H74z" fill="#FF6F61" stroke="#111111" stroke-width="9" />
    <text x="98" y="862" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="48" font-weight="900">LUNAR CAFE</text>
    <text x="82" y="908" fill="#111111" font-family="Arial, sans-serif" font-size="24" font-weight="900">6 NEW SERIALS · CREATOR NOTE · WEEKLY PICKS</text>
  </g>
</svg>
