<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="app.css">
<title>Mycelia — Field Map</title></head>
<body>
<header class="app-header">
  <span class="brand">
    <svg class="mark" viewBox="0 0 52 52"><path d="M4 27 a22 15 0 0 1 44 0 z" fill="#2A2622"/><rect x="20" y="26" width="12" height="18" rx="4" fill="#FBF7EE" stroke="#2A2622" stroke-width="2.5"/></svg>
    <span class="word">Mycelia</span>
  </span>
  <nav class="nav"><a>Identify</a><a class="active">Field Map</a><a>Logbook</a><a>Community</a></nav>
</header>

<div class="shell">
  <aside class="sidebar">
    <h3 class="title" style="font-size:20px;margin-bottom:20px;">Filters</h3>
    <div class="filter-group"><h4>Season</h4>
      <div class="opt"><span class="box"></span>Spring</div><div class="opt"><span class="box"></span>Summer</div><div class="opt on"><span class="box"></span>Autumn</div></div>
    <div class="filter-group"><h4>Habitat</h4>
      <div class="opt on"><span class="box"></span>Conifer</div><div class="opt"><span class="box"></span>Deciduous</div><div class="opt"><span class="box"></span>Meadow</div></div>
    <div class="filter-group"><h4>Edibility</h4>
      <div class="opt on"><span class="box"></span>Edible</div><div class="opt"><span class="box"></span>Unverified</div><div class="opt"><span class="box"></span>Toxic</div></div>
  </aside>

  <div class="map">
    <!-- pins -->
    <span class="pin" style="left:38%;top:48%;"><svg width="34" height="40" viewBox="0 0 52 60"><path d="M6 27 a20 13 0 0 1 40 0 z" fill="#2F4733"/><rect x="21" y="26" width="10" height="16" rx="3" fill="#FBF7EE" stroke="#2F4733" stroke-width="2"/></svg></span>
    <span class="pin" style="left:62%;top:66%;"><svg width="34" height="40" viewBox="0 0 52 60"><path d="M6 27 a20 13 0 0 1 40 0 z" fill="#2F4733"/><rect x="21" y="26" width="10" height="16" rx="3" fill="#FBF7EE" stroke="#2F4733" stroke-width="2"/></svg></span>
    <span class="pin" style="left:74%;top:34%;"><svg width="34" height="40" viewBox="0 0 52 60"><path d="M6 27 a20 13 0 0 1 40 0 z" fill="#2F4733"/><rect x="21" y="26" width="10" height="16" rx="3" fill="#FBF7EE" stroke="#2F4733" stroke-width="2"/></svg></span>
    <span class="pin" style="left:48%;top:60%;"><svg width="46" height="54" viewBox="0 0 60 70"><circle cx="30" cy="30" r="26" fill="none" stroke="#C8742B" stroke-width="3"/><path d="M10 31 a20 13 0 0 1 40 0 z" fill="#C8742B"/><rect x="25" y="30" width="10" height="16" rx="3" fill="#FBF7EE" stroke="#2A2622" stroke-width="2"/></svg></span>

    <div class="card float-card" style="left:auto;right:48px;bottom:48px;">
      <div class="inset" style="height:112px;">
        <img class="contain" src="assets/chanterelle.png" alt="Cantharellus cibarius">
      </div>
      <div>
        <div class="serif" style="font-style:italic;font-size:20px;">Cantharellus cibarius</div>
        <div class="muted" style="margin:2px 0 8px;">Golden chanterelle</div>
        <div class="mono muted" style="font-size:13px;margin-bottom:12px;">14 Jun 2026 · by A. Park</div>
        <span class="chip success">Edible · verified</span>
        <div style="margin-top:12px;font-size:14px;">Conifer floor, north-facing slope.</div>
      </div>
    </div>
  </div>
</div>
</body></html>
